<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Album – Scan to Play</title>

<!-- Fonts (falls back to system fonts if offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --night: #171A2E;      /* page background */
    --paper: #FFFFFF;      /* polaroid card */
    --ink: #F3F1EC;       /* text on dark */
    --saffron: #FFC93C;    /* accent: buttons + scan frame */
    --muted: #A9ACC4;      /* secondary text */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--night); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* ---------- Full-screen layers ---------- */
  .screen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Start screen ---------- */
  .polaroid {
    width: min(70vw, 280px);
    background: var(--paper);
    padding: 12px 12px 44px;
    border-radius: 4px;
    transform: rotate(-3deg);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    margin-bottom: 36px;
  }
  .polaroid .pic {
    aspect-ratio: 1 / 1;
    background: #2A2F52;
    display: grid; place-items: center;
  }
  .polaroid .pic::before {            /* play triangle */
    content: ""; width: 0; height: 0;
    border-left: 34px solid var(--saffron);
    border-top: 22px solid transparent;
    border-bottom: 22px solid transparent;
    margin-left: 10px;
  }
  h1 { font-size: clamp(28px, 8vw, 40px); line-height: 1.1; margin: 0 0 12px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 0 28px; max-width: 30ch; }
  button {
    font: inherit; font-weight: 700; font-size: 18px;
    background: var(--saffron); color: #1B1B1B;
    border: 0; border-radius: 999px; padding: 16px 36px; min-height: 52px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .fine { color: var(--muted); font-size: 14px; margin-top: 16px; }

  /* ---------- Loading screen ---------- */
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, .18); border-top-color: var(--saffron);
    animation: spin 0.9s linear infinite; margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .error { color: #FF8A80; max-width: 32ch; line-height: 1.5; }

  /* ---------- AR container (camera + A-Frame canvas live here) ---------- */
  #ar-root { position: fixed; inset: 0; z-index: 1; overflow: hidden; background: #000; }

  /* ---------- Scan hint (shown while no photo is detected) ---------- */
  #hint {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  }
  .frame { position: relative; width: min(72vw, 300px); aspect-ratio: 4 / 3; }
  .frame i { position: absolute; width: 36px; height: 36px; border: 0 solid var(--saffron); }
  .frame i:nth-child(1) { top: 0; left: 0;  border-top-width: 5px;    border-left-width: 5px; }
  .frame i:nth-child(2) { top: 0; right: 0; border-top-width: 5px;    border-right-width: 5px; }
  .frame i:nth-child(3) { bottom: 0; left: 0;  border-bottom-width: 5px; border-left-width: 5px; }
  .frame i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 5px; border-right-width: 5px; }
  #hint p {
    margin: 0; padding: 8px 16px; border-radius: 999px;
    background: rgba(23, 26, 46, .78); font-weight: 500; font-size: 16px;
  }

  /* ---------- Small buttons on top of the camera ---------- */
  .chip {
    position: fixed; z-index: 15; font-size: 15px; min-height: 44px; padding: 10px 18px;
    background: rgba(23, 26, 46, .85); color: var(--ink);
  }
  #back  { top: calc(14px + env(safe-area-inset-top, 0px)); left: 14px; }
  #sound { top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; background: var(--saffron); color: #1B1B1B; }
</style>

<!-- A-Frame + MindAR (image tracking build). Pinned versions. -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <!-- 1) START SCREEN: the tap here is the user gesture that lets videos play with sound -->
  <section id="start" class="screen">
    <div class="polaroid" aria-hidden="true"><div class="pic"></div></div>
    <h1>Scan a photo.<br>Watch it play.</h1>
    <p class="sub">Point your camera at a photo from the album and its video starts on the page.</p>
    <button id="startBtn" type="button">Start Scanning</button>
    <div class="fine">Tap to start. This also turns the sound on.</div>
  </section>

  <!-- 2) LOADING SCREEN -->
  <section id="loading" class="screen hidden">
    <div class="spinner" aria-hidden="true"></div>
    <div id="loadingText">Starting camera…</div>
  </section>

  <!-- 3) AR CAMERA VIEW -->
  <div id="ar-root"></div>

  <div id="hint" class="hidden">
    <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p>Point camera at a photo</p>
  </div>

  <button id="back"  class="chip hidden" type="button">Back</button>
  <button id="sound" class="chip hidden" type="button">Tap for sound</button>

<script>
/* =====================================================================
   CONFIG  –  to add a new photo, add ONE line to this array.
   ---------------------------------------------------------------------
   targetIndex : position of the photo in targets.mind
                 (0 = first photo you uploaded in the MindAR compiler,
                  1 = second, ... the order MUST match)
   video       : path to the video file for that photo
   aspect      : (optional) photo HEIGHT / WIDTH, e.g. 4x6 landscape = 0.667,
                 square = 1, portrait 6x4 = 1.5. If you leave it out, the
                 video's own shape is used.
   ===================================================================== */
const ALBUM = [
  { targetIndex: 0, video: "video1.mp4", aspect: 0.75 },
  { targetIndex: 1, video: "video2.mp4" },
  // { targetIndex: 2, video: "video3.mp4" },
];

const TARGETS_FILE     = "targets.mind"; // compiled by the MindAR compiler (same folder as index.html)
const RESTART_ON_FOUND = false;  // false = resume where it paused, true = restart each time

/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const startScreen = $("start"), loadingScreen = $("loading"), loadingText = $("loadingText");
const hint = $("hint"), backBtn = $("back"), soundBtn = $("sound"), arRoot = $("ar-root");

let videos = [];       // one <video> element per ALBUM entry
let foundCount = 0;    // how many photos are currently detected

/* ---------- Start button ---------- */
$("startBtn").addEventListener("click", () => {
  startScreen.classList.add("hidden");
  loadingScreen.classList.remove("hidden");

  // Create the videos INSIDE the tap handler so the browser treats them as
  // user-approved (needed for autoplay with sound, especially on iPhone).
  videos = ALBUM.map(makeVideo);
  videos.forEach(unlockVideo);

  buildScene();
});

/* ---------- Create a <video> element for one album entry ---------- */
function makeVideo(item, i) {
  const v = document.createElement("video");
  v.id = "video-" + i;
  v.src = item.video;
  v.loop = true;
  v.preload = "auto";
  v.crossOrigin = "anonymous";
  v.playsInline = true;                          // iPhone: play inside the page, not fullscreen
  v.setAttribute("playsinline", "");
  v.setAttribute("webkit-playsinline", "");
  return v;
}

/* Play-then-pause once during the tap. After this, the browser lets us call
   play() later (when a photo is detected) without another tap. */
function unlockVideo(v) {
  const p = v.play();
  if (p && p.then) {
    p.then(() => { if (!v.dataset.wanted) v.pause(); }).catch(() => {});
  }
}

/* ---------- Build the A-Frame / MindAR scene from the ALBUM array ---------- */
function buildScene() {
  const scene = document.createElement("a-scene");
  scene.setAttribute("mindar-image",
    `imageTargetSrc: ${TARGETS_FILE}; autoStart: true; uiLoading: no; uiScanning: no; uiError: no`);
  scene.setAttribute("color-space", "sRGB");
  scene.setAttribute("vr-mode-ui", "enabled: false");
  scene.setAttribute("device-orientation-permission-ui", "enabled: false");
  scene.setAttribute("embedded", "");

  // Assets: our videos
  const assets = document.createElement("a-assets");
  assets.setAttribute("timeout", "30000");
  videos.forEach((v) => assets.appendChild(v));
  scene.appendChild(assets);

  // Camera (MindAR moves it, so turn off normal look controls)
  const cam = document.createElement("a-camera");
  cam.setAttribute("position", "0 0 0");
  cam.setAttribute("look-controls", "enabled: false");
  scene.appendChild(cam);

  // One target entity per photo, each with a video plane on top of it
  ALBUM.forEach((item, i) => {
    const v = videos[i];

    const target = document.createElement("a-entity");
    target.setAttribute("mindar-image-target", `targetIndex: ${item.targetIndex}`);

    // MindAR units: the photo is 1 wide, so the plane is 1 wide too.
    const plane = document.createElement("a-video");
    plane.setAttribute("src", "#" + v.id);
    plane.setAttribute("width", "1");
    plane.setAttribute("height", String(item.aspect || 0.75));
    plane.setAttribute("position", "0 0 0.01");   // tiny lift so it sits above the photo
    target.appendChild(plane);

    // If no aspect was given, match the video's own shape once it is known
    if (!item.aspect) {
      v.addEventListener("loadedmetadata", () => {
        if (v.videoWidth) plane.setAttribute("height", String(v.videoHeight / v.videoWidth));
      });
    }

    target.addEventListener("targetFound", () => onFound(v));
    target.addEventListener("targetLost",  () => onLost(v));
    scene.appendChild(target);
  });

  // MindAR events: camera + targets ready / failed
  scene.addEventListener("arReady", () => {
    loadingScreen.classList.add("hidden");
    hint.classList.remove("hidden");
    backBtn.classList.remove("hidden");
  });
  scene.addEventListener("arError", () => {
    loadingScreen.classList.remove("hidden");
    loadingScreen.innerHTML =
      '<p class="error">Could not start. Allow camera access, open the site over HTTPS, ' +
      'and check that targets.mind exists.</p><button type="button" onclick="location.reload()">Try again</button>';
  });

  arRoot.appendChild(scene);
}

/* ---------- Photo detected: play its video ---------- */
function onFound(v) {
  foundCount++;
  hint.classList.add("hidden");
  v.dataset.wanted = "1";
  if (RESTART_ON_FOUND) v.currentTime = 0;

  const p = v.play();
  if (p && p.catch) {
    p.catch(() => {
      // Sound was blocked: play muted and offer a button to turn sound on
      v.muted = true;
      v.play().catch(() => {});
      soundBtn.classList.remove("hidden");
    });
  }
}

/* ---------- Photo lost: pause its video ---------- */
function onLost(v) {
  foundCount = Math.max(0, foundCount - 1);
  delete v.dataset.wanted;
  v.pause();
  if (foundCount === 0) hint.classList.remove("hidden");
}

/* ---------- Buttons ---------- */
soundBtn.addEventListener("click", () => {
  videos.forEach((v) => { v.muted = false; });
  soundBtn.classList.add("hidden");
});
backBtn.addEventListener("click", () => location.reload());  // reload = stops the camera cleanly
</script>
</body>
</html>
